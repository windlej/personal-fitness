# Optional: deploy to GitHub Pages via Actions and rebuild data/plan.js
# from the workbook on every push.
#
# To use this, set:  Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# If you'd rather keep it dead simple (no Actions), delete this file and use:
#   Settings -> Pages -> Source = "Deploy from a branch" -> main / (root)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild plan data from workbook
        run: |
          pip install openpyxl
          python3 scripts/build_plan.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
