<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Training Log · Run + Kettlebell</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <strong>Training Log</strong>
          <span id="brand-sub">12-month plan</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="ghost-btn" id="paces-btn" title="Training paces">Paces</button>
        <button class="ghost-btn" id="data-btn" title="Export / import data">Data</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="day" class="active">Today</button>
    <button data-view="week">Week</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="journal">Journal</button>
    <button data-view="progress">Progress</button>
    <button data-view="plan">Plan</button>
  </nav>

  <main id="app"></main>

  <footer class="footer">
    <span>Saved locally in this browser. Export regularly to back up.</span>
  </footer>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Data</h2>
        <button class="ghost-btn" id="modal-close">Close</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="data/plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
